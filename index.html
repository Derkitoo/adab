<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adab - Le comportement d'excellence</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!--- Babel (pour lire le JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap');
        body { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- MOCK DES ICONES LUCIDE POUR LE NAVIGATEUR ---
        const createIcon = (name) => ({ className, strokeWidth = 2 }) => (
            <i data-lucide={name} className={className} style={{ strokeWidth }}></i>
        );
        const BookOpen = createIcon('book-open');
        const Heart = createIcon('heart');
        const Users = createIcon('users');
        const Coffee = createIcon('coffee');
        const ArrowLeft = createIcon('arrow-left');
        const Globe = createIcon('globe');
        const ChevronRight = createIcon('chevron-right');
        const Check = createIcon('check');
        const X = createIcon('x');
        const Sparkles = createIcon('sparkles');
        const MessageCircle = createIcon('message-circle');
        const Flame = createIcon('flame');
        const Smartphone = createIcon('smartphone');
        const Star = createIcon('star');
        const Smile = createIcon('smile');
        const Baby = createIcon('baby');
        const Home = createIcon('home');
        const Navigation = createIcon('navigation');
        const Briefcase = createIcon('briefcase');
        const Stethoscope = createIcon('stethoscope');
        const Handshake = createIcon('handshake');
        const Moon = createIcon('moon');
        const Sun = createIcon('sun');
        const Share2 = createIcon('share-2');
        const Search = createIcon('search');
        const GraduationCap = createIcon('graduation-cap');
        const Landmark = createIcon('landmark');
        const Target = createIcon('target');

        // --- BASE DE DONNÉES COMPLÈTE ---
        const appData = {
            ui: {
                greeting: { fr: "Salam ! ✨", ar: "سلام! ✨" },
                title: { fr: "Adab", ar: "أدب" },
                subtitle: { fr: "Le comportement d'excellence", ar: "السلوك المتميز" },
                dailyAdab: { fr: "Pépite du jour", ar: "جوهرة اليوم" },
                dailyChallenge: { fr: "Défi du jour", ar: "تحدي اليوم" },
                back: { fr: "Retour", ar: "رجوع" },
                host: { fr: "Si vous invitez", ar: "إذا كنت المضيف" },
                guest: { fr: "Si vous êtes invité", ar: "إذا كنت ضيفاً" },
                favorites: { fr: "Mes Favoris", ar: "مفضلتي" },
                noFavorites: { fr: "Aucun favori pour le moment.", ar: "لا توجد مفضلة حتى الآن." },
                copied: { fr: "Copié dans le presse-papier !", ar: "تم النسخ بنجاح!" }
            },
            categories: [
                {
                    id: 'prophetic', icon: 'BookOpen', gradient: "from-blue-500 to-cyan-400", lightBg: "bg-blue-50", textColor: "text-blue-600",
                    title: { fr: "Modèle Prophétique", ar: "النموذج النبوي" },
                    desc: { fr: "L'attitude du Prophète (ﷺ) en société.", ar: "هدي النبي ﷺ في مجالسه." },
                    items: [
                        {
                            title: { fr: "L'Humilité incarnée", ar: "التواضع والبساطة" },
                            content: { fr: "Il ne s'attribuait aucune place fixe pour éviter l'orgueil. Lorsqu'il rejoignait un groupe, il s'asseyait simplement là où l'assemblée se terminait.", ar: "كان ﷺ لا يوطّن الأماكن منعا للكبر، وإذا انتهى إلى قوم جلس حيث ينتهي به المجلس ولا يتخطى رقاب الناس." },
                            action: { fr: "Aujourd'hui, choisissez volontairement la place la moins 'prestigieuse' dans une assemblée.", ar: "اختر اليوم الجلوس في مكان متواضع في المجلس." },
                            type: "do"
                        },
                        {
                            title: { fr: "L'Art de l'Écoute", ar: "فن الاستماع والإنصات" },
                            content: { fr: "Il ne coupait jamais la parole et écoutait attentivement. Il accordait autant d'attention à la dernière personne à parler qu'à la première.", ar: "لم يكن يقطع حديث أحد أو ينصرف عنه تبرماً، بل يظل مستمعاً." },
                            action: { fr: "Écoutez une personne jusqu'au bout aujourd'hui sans l'interrompre ni préparer votre réponse.", ar: "استمع لشخص حتى النهاية اليوم دون مقاطعته." },
                            type: "do"
                        },
                        {
                            title: { fr: "L'Ignorance feinte (At-Taghaful)", ar: "التغافل" },
                            content: { fr: "S'il voyait ou entendait une chose déplaisante, il faisait semblant de ne rien remarquer pour préserver la dignité de l'auteur.", ar: "يتغافل عما لا يشتهي تكرماً وحفظاً لماء وجه فاعله." },
                            action: { fr: "Ignorez volontairement une erreur ou une maladresse d'un proche aujourd'hui.", ar: "تغافل اليوم عن خطأ صغير أو زلة لمن حولك." },
                            type: "info"
                        }
                    ]
                },
                {
                    id: 'family', icon: 'Heart', gradient: "from-rose-500 to-pink-400", lightBg: "bg-rose-50", textColor: "text-rose-600",
                    title: { fr: "Cercle Familial", ar: "الدائرة الأسرية" },
                    desc: { fr: "Le bon comportement envers les parents.", ar: "الأدب والبر مع الوالدين." },
                    items: [
                        {
                            title: { fr: "Patience au quotidien", ar: "أدب الحديث" },
                            content: { fr: "Ne leur reprochez pas leurs oublis. S'ils posent une question déjà répondue, ne dites pas 'Je te l'ai déjà dit'.", ar: "إذا سألك أحدهما عن شيء فلا تقل 'أخبرتك به سابقاً'." },
                            type: "do"
                        },
                        {
                            title: { fr: "Valorisez-les", ar: "إشعارهم بأهميتهم" },
                            content: { fr: "Ne les mettez jamais 'hors service'. Consultez votre père, valorisez son opinion.", ar: "لا تترك الاستعانة بهم فهذا يشعرهم بأنهم خارج الخدمة." },
                            action: { fr: "Demandez conseil à l'un de vos parents aujourd'hui sur un sujet, juste pour les valoriser.", ar: "استشر أحد والديك اليوم في أمر ما لإشعارهم بأهميتهم." },
                            type: "do"
                        }
                    ]
                },
                {
                    id: 'social', icon: 'Users', gradient: "from-violet-500 to-purple-400", lightBg: "bg-violet-50", textColor: "text-violet-600",
                    title: { fr: "Vie Sociale", ar: "الحياة الاجتماعية" },
                    desc: { fr: "Invitations, rencontres et assises.", ar: "أدب الدعوات والجلوس." },
                    hasTabs: true,
                    items: {
                        host: [
                            {
                                title: { fr: "Informer sans questionner", ar: "أخبِر ولا تستخبِر" },
                                content: { fr: "Informez vos invités de la liste des personnes présentes et du motif. Les gens aiment savoir à quoi s'attendre.", ar: "أخبر من تدعوه بنوعية الحضور وسبب اللقاء." },
                                type: "do"
                            }
                        ],
                        guest: [
                            {
                                title: { fr: "Ne pas séparer deux personnes", ar: "التفريق بين اثنين" },
                                content: { fr: "En vous asseyant, il est interdit de vous glisser entre deux personnes déjà assises l'une à côté de l'autre sans permission.", ar: "لا يحل لرجل أن يفرق بين اثنين إلا بإذنهما." },
                                type: "dont"
                            }
                        ]
                    }
                },
                {
                    id: 'hospitality', icon: 'Coffee', gradient: "from-amber-500 to-orange-400", lightBg: "bg-amber-50", textColor: "text-amber-600",
                    title: { fr: "Hospitalité", ar: "آداب الطعام" },
                    desc: { fr: "L'art de recevoir et manger.", ar: "فن الاستقبال والأكل بلباقة." },
                    items: [
                        {
                            title: { fr: "Le bruit et le gaspillage", ar: "الرشاف والمرنخ" },
                            content: { fr: "Évitez de faire du bruit en aspirant une boisson, et de remettre un morceau déjà croqué dans la sauce commune.", ar: "تجنب الرشاف الذي يخرج الصوت عند الاحتساء." },
                            action: { fr: "Lors de votre prochain repas, buvez en trois respirations pour appliquer la Sunnah.", ar: "في وجبتك القادمة، اشرب الماء على ثلاث دفعات خارج الإناء." },
                            type: "dont"
                        }
                    ]
                },
                {
                    id: 'digital', icon: 'Smartphone', gradient: "from-indigo-500 to-blue-500", lightBg: "bg-indigo-50", textColor: "text-indigo-600",
                    title: { fr: "Adab Numérique", ar: "الأدب الرقمي" },
                    desc: { fr: "Savoir-vivre sur les réseaux.", ar: "السلوك الراقي على الشبكات." },
                    items: [
                        {
                            title: { fr: "Le Comportement Numérique", ar: "مجموعات العائلة" },
                            content: { fr: "Dans les groupes familiaux, interagissez ! Ouvrez leurs liens, dites 'Amine'. Votre silence inquiète.", ar: "في جروب العائلة: لا تترك التفاعل مع ما يرسلون." },
                            action: { fr: "Laissez un message vocal chaleureux dans le groupe de votre famille aujourd'hui.", ar: "أرسل رسالة صوتية دافئة في مجموعة عائلتك اليوم." },
                            type: "do"
                        }
                    ]
                },
                {
                    id: 'mosque', icon: 'Landmark', gradient: "from-emerald-500 to-green-600", lightBg: "bg-emerald-50", textColor: "text-emerald-600",
                    title: { fr: "Adab à la Mosquée", ar: "آداب المسجد" },
                    desc: { fr: "Le respect de la maison d'Allah.", ar: "تعظيم بيوت الله." },
                    items: [
                        {
                            title: { fr: "La Sutrah", ar: "السترة والمرور" },
                            content: { fr: "Ne passez jamais devant une personne en pleine prière (entre elle et sa Sutrah).", ar: "لا تمر بين يدي المصلي وسترته." },
                            action: { fr: "La prochaine fois que vous priez, placez un objet (Sutrah) devant vous.", ar: "في صلاتك القادمة، اتخذ سترة أمامك لتحديد مساحة صلاتك." },
                            type: "dont"
                        }
                    ]
                },
                {
                    id: 'student', icon: 'GraduationCap', gradient: "from-indigo-600 to-violet-600", lightBg: "bg-indigo-50", textColor: "text-indigo-600",
                    title: { fr: "Étudiant & Science", ar: "طالب العلم" },
                    desc: { fr: "Le comportement vers le savoir.", ar: "الأدب مع العلم والمعلم." },
                    items: [
                        {
                            title: { fr: "L'action confirme le savoir", ar: "العمل بالعلم" },
                            content: { fr: "Le but de la science n'est pas de mémoriser pour briller, mais de mettre en pratique.", ar: "الغاية من العلم العمل به لا المباهاة في المجالس." },
                            action: { fr: "Apprenez une petite Sunnah aujourd'hui et appliquez-la immédiatement.", ar: "تعلم سُنة صغيرة اليوم وطبقها فوراً." },
                            type: "do"
                        }
                    ]
                }
            ]
        };

        const IconHelper = ({ name, className }) => {
            const icons = { BookOpen, Heart, Users, Coffee, Flame, Smartphone, Star, Smile, Baby, Home, Navigation, Briefcase, Stethoscope, Handshake, Landmark, GraduationCap };
            const IconComponent = icons[name] || BookOpen;
            return <IconComponent className={className} />;
        };

        function App() {
            const [lang, setLang] = useState('fr'); 
            const [currentView, setCurrentView] = useState('dashboard'); 
            const [activeTab, setActiveTab] = useState('host'); 
            const [animateCards, setAnimateCards] = useState(false);
            const [theme, setTheme] = useState(localStorage.getItem('adab_theme') || 'light');
            const [favorites, setFavorites] = useState(() => JSON.parse(localStorage.getItem('adab_favorites')) || []);
            const [toast, setToast] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [dailyTip, setDailyTip] = useState(null);

            const isRtl = lang === 'ar';
            const activeCategory = appData.categories.find(c => c.id === currentView);

            // Générer le PWA Manifest dynamiquement
            useEffect(() => {
                const manifest = {
                    name: "Adab App", short_name: "Adab", display: "standalone", start_url: ".",
                    background_color: theme === 'dark' ? "#0f172a" : "#f8fafc",
                    theme_color: "#10b981",
                    icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTBiOTgxIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTIgM2g2YTRgNCAwIDAgMSA0IDR2MTRhMyAzIDAgMCAwLTMtM0gyeiIvPjxwYXRoIGQ9Ik0yMiAzSDE2YTQgNCAwIDAgMC00IDR2MTRhMyAzIDAgMCAxIDMtM2g3eiIvPjwvc3ZnPg==", sizes: "192x192", type: "image/svg+xml" }]
                };
                const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
                let link = document.querySelector('link[rel="manifest"]');
                if (!link) { link = document.createElement('link'); link.rel = 'manifest'; document.head.appendChild(link); }
                link.href = URL.createObjectURL(manifestBlob);
            }, [theme]);

            // Initialiser les icônes Lucide après chaque rendu
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                let allItems = [];
                appData.categories.forEach(cat => {
                    if (cat.hasTabs) {
                        Object.values(cat.items).forEach(arr => arr.forEach(item => allItems.push({ ...item, categoryTitle: cat.title })));
                    } else {
                        cat.items.forEach(item => allItems.push({ ...item, categoryTitle: cat.title }));
                    }
                });
                const randomIndex = Math.floor(Math.random() * allItems.length);
                setDailyTip(allItems[randomIndex]);
            }, [lang]); 

            useEffect(() => {
                setAnimateCards(true);
                const timer = setTimeout(() => setAnimateCards(false), 500);
                return () => clearTimeout(timer);
            }, [activeTab, currentView, searchQuery]);

            useEffect(() => {
                localStorage.setItem('adab_theme', theme);
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('adab_favorites', JSON.stringify(favorites));
            }, [favorites]);

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
            const toggleFavorite = (id) => setFavorites(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
            
            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const shareCard = (item) => {
                let text = `✨ ${item.title[lang]}\n\n📖 ${item.content[lang]}\n\n— Adab App`;
                if (navigator.share) navigator.share({ title: item.title[lang], text }).catch(console.error);
                else { navigator.clipboard.writeText(text); showToast(appData.ui.copied[lang]); }
            };

            const searchResults = useMemo(() => {
                if (!searchQuery.trim()) return [];
                const query = searchQuery.toLowerCase();
                const results = [];
                appData.categories.forEach(cat => {
                    if (cat.hasTabs) {
                        Object.keys(cat.items).forEach(tabKey => {
                            cat.items[tabKey].forEach((item, index) => {
                                if (item.title.fr.toLowerCase().includes(query) || item.title.ar.includes(query) || item.content.fr.toLowerCase().includes(query) || item.content.ar.includes(query))
                                    results.push({ item, index, catId: cat.id, subCat: tabKey });
                            });
                        });
                    } else {
                        cat.items.forEach((item, index) => {
                            if (item.title.fr.toLowerCase().includes(query) || item.title.ar.includes(query) || item.content.fr.toLowerCase().includes(query) || item.content.ar.includes(query))
                                results.push({ item, index, catId: cat.id, subCat: null });
                        });
                    }
                });
                return results;
            }, [searchQuery]);

            const renderCard = (item, index, categoryId, subCategory = null) => {
                let iconBg = "bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300";
                let Icon = MessageCircle;
                
                if (item.type === 'do') { iconBg = "bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400"; Icon = Check; }
                else if (item.type === 'dont') { iconBg = "bg-rose-100 text-rose-600 dark:bg-rose-900/50 dark:text-rose-400"; Icon = X; }
                else if (item.type === 'info') { iconBg = "bg-blue-100 text-blue-600 dark:bg-blue-900/50 dark:text-blue-400"; Icon = Sparkles; }

                const uniqueId = subCategory ? `${categoryId}-${subCategory}-${index}` : `${categoryId}-${index}`;
                const isFav = favorites.includes(uniqueId);

                return (
                    <div key={uniqueId} className={`bg-white/80 dark:bg-slate-800/90 backdrop-blur-xl p-6 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white dark:border-slate-700 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 ${animateCards ? 'animate-in fade-in slide-in-from-bottom-4' : ''}`} style={{ animationDelay: `${index * 100}ms`, animationFillMode: 'both' }}>
                        <div className="flex gap-4 mb-4">
                            <div className={`w-12 h-12 rounded-full ${iconBg} flex items-center justify-center flex-shrink-0 mt-1`}>
                                <Icon className="w-6 h-6" strokeWidth={2.5} />
                            </div>
                            <div>
                                <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-2 leading-tight">{item.title[lang]}</h3>
                                <p className="text-slate-600 dark:text-slate-300 leading-relaxed font-medium">{item.content[lang]}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 mt-4 pt-4 border-t border-slate-100 dark:border-slate-700/50">
                            <button onClick={() => toggleFavorite(uniqueId)} className={`flex-1 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all active:scale-95 ${isFav ? 'bg-rose-100 text-rose-500 dark:bg-rose-900/50 dark:text-rose-400' : 'bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700'}`}>
                                <Heart className={`w-4 h-4 ${isFav ? 'fill-current' : ''}`} />
                                {isFav ? (lang === 'fr' ? 'Sauvegardé' : 'محفوظ') : (lang === 'fr' ? 'Sauvegarder' : 'حفظ')}
                            </button>
                            <button onClick={() => shareCard(item)} className="w-10 h-10 rounded-xl bg-slate-50 text-slate-400 hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center transition-all active:scale-95">
                                <Share2 className="w-4 h-4" />
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className={`min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 relative overflow-hidden transition-colors duration-500 ${isRtl ? 'text-right' : 'text-left'}`} dir={isRtl ? 'rtl' : 'ltr'} style={isRtl ? { fontFamily: "'Cairo', 'Tajawal', sans-serif" } : { fontFamily: "'Inter', sans-serif" }}>
                    
                    {/* Background Orbs */}
                    <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-emerald-300/20 dark:bg-emerald-500/10 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[80px] animate-[spin_20s_linear_infinite]" />
                        <div className="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-violet-300/20 dark:bg-violet-500/10 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[80px] animate-[spin_25s_linear_infinite_reverse]" />
                        <div className="absolute top-[40%] left-[20%] w-[40vw] h-[40vw] bg-amber-300/20 dark:bg-amber-500/10 rounded-full mix-blend-multiply dark:mix-blend-lighten filter blur-[80px] animate-pulse" />
                    </div>

                    <div className="relative z-10 flex flex-col min-h-screen max-w-lg mx-auto bg-white/40 dark:bg-slate-900/40 backdrop-blur-3xl shadow-2xl sm:border-x border-white/50 dark:border-slate-800">
                        
                        {/* Header */}
                        <header className="px-6 py-5 flex items-center justify-between sticky top-0 bg-white/70 dark:bg-slate-900/70 backdrop-blur-lg border-b border-white/50 dark:border-slate-800 z-20">
                            <div className="flex items-center gap-3">
                                {currentView !== 'dashboard' && (
                                    <button onClick={() => { setCurrentView('dashboard'); setSearchQuery(''); }} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all">
                                        {isRtl ? <ChevronRight className="w-6 h-6" /> : <ArrowLeft className="w-6 h-6" />}
                                    </button>
                                )}
                                {currentView === 'dashboard' && (
                                    <div className="flex items-center gap-2">
                                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-200 dark:shadow-none">
                                            <BookOpen className="w-5 h-5 text-white" />
                                        </div>
                                        <span className="font-extrabold text-xl tracking-tight text-slate-800 dark:text-white">{appData.ui.title[lang]}</span>
                                    </div>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all">
                                    {theme === 'light' ? <Moon className="w-5 h-5" /> : <Sun className="w-5 h-5" />}
                                </button>
                                <button onClick={() => setLang(lang === 'fr' ? 'ar' : 'fr')} className="flex items-center gap-2 bg-white dark:bg-slate-800 px-4 py-2 rounded-full shadow-sm text-sm font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 hover:shadow active:scale-95 transition-all">
                                    <Globe className="w-4 h-4 text-emerald-500" />
                                    {lang === 'fr' ? 'العربية' : 'FR'}
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 p-6 overflow-y-auto pb-24 scroll-smooth">
                            {currentView === 'dashboard' && (
                                <div className="animate-in fade-in slide-in-from-bottom-8 duration-500">
                                    
                                    <div className="flex items-center justify-between mb-6 mt-2">
                                        <h2 className="text-3xl font-extrabold text-slate-800 dark:text-white">{appData.ui.greeting[lang]}</h2>
                                        <button onClick={() => setCurrentView('favorites')} className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center text-rose-500 dark:text-rose-400 shadow-sm hover:scale-105 active:scale-95 transition-all relative">
                                            <Heart className="w-6 h-6 fill-current" />
                                            {favorites.length > 0 && <span className="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 rounded-full border-2 border-white dark:border-slate-900"></span>}
                                        </button>
                                    </div>

                                    <div className="relative mb-8 group">
                                        <Search className={`absolute ${isRtl ? 'right-4' : 'left-4'} top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-emerald-500 transition-colors`} />
                                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder={lang === 'fr' ? 'Rechercher un conseil...' : 'ابحث عن نصيحة...'} className={`w-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl border border-white/50 dark:border-slate-700 rounded-2xl py-3.5 ${isRtl ? 'pr-12 pl-4' : 'pl-12 pr-4'} text-slate-800 dark:text-white shadow-[0_4px_20px_rgb(0,0,0,0.03)] focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all placeholder:text-slate-400 font-medium`} />
                                        {searchQuery && (
                                            <button onClick={() => setSearchQuery('')} className={`absolute ${isRtl ? 'left-4' : 'right-4'} top-1/2 -translate-y-1/2 p-1.5 bg-slate-200 dark:bg-slate-700 rounded-full text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition-colors`}>
                                                <X className="w-3.5 h-3.5" />
                                            </button>
                                        )}
                                    </div>

                                    {searchQuery ? (
                                        <div className="space-y-4">
                                            <h3 className="text-sm font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-4 px-1">{searchResults.length} résultat(s)</h3>
                                            {searchResults.length > 0 ? searchResults.map(res => renderCard(res.item, res.index, res.catId, res.subCat)) : (
                                                <div className="text-center py-12 text-slate-400 dark:text-slate-500 bg-white/50 dark:bg-slate-800/50 rounded-3xl border border-white dark:border-slate-700">
                                                    <Search className="w-12 h-12 mx-auto mb-4 opacity-20" />
                                                    <p className="font-medium text-lg">Aucun résultat trouvé.</p>
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <>
                                            {dailyTip && (
                                                <div className="relative rounded-3xl overflow-hidden mb-10 shadow-xl shadow-emerald-200/50 dark:shadow-none group cursor-pointer hover:scale-[1.02] active:scale-[0.98] transition-all flex flex-col">
                                                    <div className="absolute inset-0 bg-gradient-to-br from-emerald-400 via-teal-500 to-cyan-500 dark:from-emerald-600 dark:via-teal-700 dark:to-cyan-700"></div>
                                                    <div className="relative p-7 text-white flex-1">
                                                        <div className="flex items-center justify-between mb-4">
                                                            <div className="bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5"><Sparkles className="w-3.5 h-3.5" /> {appData.ui.dailyAdab[lang]}</div>
                                                            {dailyTip.categoryTitle && <span className="text-xs font-bold opacity-90 uppercase tracking-wider bg-black/10 px-3 py-1 rounded-full">{dailyTip.categoryTitle[lang]}</span>}
                                                        </div>
                                                        <h3 className="text-2xl font-bold mb-3 leading-tight">{dailyTip.title[lang]}</h3>
                                                        <p className="text-white/90 text-[1.05rem] leading-relaxed">{dailyTip.content[lang]}</p>
                                                    </div>
                                                    <div className="relative bg-white/10 backdrop-blur-md border-t border-white/20 p-5 mt-auto">
                                                        <div className="flex items-start gap-3">
                                                            <div className="bg-white/20 p-2 rounded-xl shrink-0"><Target className="w-5 h-5 text-white" /></div>
                                                            <div>
                                                                <span className="text-xs font-bold text-emerald-100 uppercase tracking-wider block mb-1">{appData.ui.dailyChallenge[lang]}</span>
                                                                <p className="text-sm font-semibold text-white">{dailyTip.action ? dailyTip.action[lang] : "Prenez l'intention d'appliquer cette Sunnah aujourd'hui."}</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            <div className="grid grid-cols-2 gap-4">
                                                {appData.categories.map((category, idx) => (
                                                    <button key={category.id} onClick={() => setCurrentView(category.id)} className={`bg-white/80 dark:bg-slate-800/90 backdrop-blur-xl p-5 rounded-3xl shadow-sm border border-white dark:border-slate-700 hover:shadow-lg hover:-translate-y-1 transition-all group relative overflow-hidden flex flex-col h-full ${isRtl ? 'text-right' : 'text-left'}`} style={{ animationDelay: `${idx * 50}ms` }}>
                                                        <div className={`absolute inset-0 bg-gradient-to-br ${category.gradient} opacity-0 group-hover:opacity-10 dark:group-hover:opacity-20 transition-opacity`} />
                                                        <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${category.gradient} flex items-center justify-center shadow-lg mb-4 transform group-hover:scale-110 group-hover:rotate-3 transition-transform`}>
                                                            <IconHelper name={category.icon} className="w-6 h-6 text-white" />
                                                        </div>
                                                        <h3 className="font-extrabold text-lg text-slate-800 dark:text-white mb-1.5 leading-tight">{category.title[lang]}</h3>
                                                        <p className="text-xs font-medium text-slate-500 dark:text-slate-400 leading-relaxed mt-auto">{category.desc[lang]}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}

                            {currentView === 'favorites' && (
                                <div className="animate-in fade-in slide-in-from-right-8 duration-500">
                                    <div className="flex items-center gap-3 mb-8 mt-2">
                                        <div className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-900/50 flex items-center justify-center"><Heart className="w-6 h-6 text-rose-500 dark:text-rose-400 fill-current" /></div>
                                        <div>
                                            <h2 className="text-2xl font-extrabold text-slate-800 dark:text-white">{appData.ui.favorites[lang]}</h2>
                                            <p className="text-sm font-medium text-slate-500 dark:text-slate-400">{favorites.length} élément(s)</p>
                                        </div>
                                    </div>
                                    {favorites.length === 0 ? (
                                        <div className="text-center py-20 text-slate-400 dark:text-slate-500"><Heart className="w-16 h-16 mx-auto mb-4 opacity-20" /><p className="font-medium text-lg">{appData.ui.noFavorites[lang]}</p></div>
                                    ) : (
                                        <div className="space-y-4">
                                            {favorites.map((favId, index) => {
                                                const [catId, ...rest] = favId.split('-');
                                                let subCat = null, itemIndexStr = null;
                                                if (rest.length === 2) { subCat = rest[0]; itemIndexStr = rest[1]; } else { itemIndexStr = rest[0]; }
                                                const category = appData.categories.find(c => c.id === catId);
                                                if (!category) return null;
                                                const item = category.hasTabs && subCat ? category.items[subCat][parseInt(itemIndexStr, 10)] : category.items[parseInt(itemIndexStr, 10)];
                                                if (!item) return null;
                                                return renderCard(item, index, catId, subCat);
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentView !== 'dashboard' && currentView !== 'favorites' && activeCategory && (
                                <div className="animate-in fade-in slide-in-from-right-8 duration-500">
                                    <div className="flex items-center gap-4 mb-8 mt-2">
                                        <div className={`w-16 h-16 rounded-3xl bg-gradient-to-br ${activeCategory.gradient} flex items-center justify-center shadow-lg transform rotate-3`}>
                                            <IconHelper name={activeCategory.icon} className="w-8 h-8 text-white" />
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-extrabold text-slate-800 dark:text-white leading-tight">{activeCategory.title[lang]}</h2>
                                            <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">{activeCategory.desc[lang]}</p>
                                        </div>
                                    </div>
                                    {activeCategory.hasTabs && (
                                        <div className="bg-slate-200/50 dark:bg-slate-800/50 backdrop-blur-sm p-1.5 rounded-2xl mb-8 flex relative">
                                            <button onClick={() => setActiveTab('host')} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all z-10 ${activeTab === 'host' ? 'text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'}`}>{appData.ui.host[lang]}</button>
                                            <button onClick={() => setActiveTab('guest')} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all z-10 ${activeTab === 'guest' ? 'text-slate-800 dark:text-white' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-300'}`}>{appData.ui.guest[lang]}</button>
                                            <div className="absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-white dark:bg-slate-700 rounded-xl shadow transition-transform duration-300 ease-out" style={{ transform: activeTab === 'guest' ? (isRtl ? 'translateX(-100%)' : 'translateX(100%)') : 'translateX(0)' }} />
                                        </div>
                                    )}
                                    <div className="space-y-4">
                                        {activeCategory.hasTabs ? activeCategory.items[activeTab].map((item, index) => renderCard(item, index, activeCategory.id, activeTab)) : activeCategory.items.map((item, index) => renderCard(item, index, activeCategory.id))}
                                    </div>
                                </div>
                            )}
                        </main>
                        
                        <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 dark:bg-emerald-600 text-white px-5 py-3 rounded-full shadow-2xl text-sm font-bold transition-all duration-300 z-50 flex items-center gap-2 ${toast ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                            <Check className="w-5 h-5 text-emerald-400 dark:text-white" />
                            <span>{toast}</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
